maxPlayerCount = 16
roundTime = 1500
mapDirectory = ./maps/
port = 6510
password =
adminPassword =
serverList_register = false
onlineName = Test Server

# Game mode: timeattack (original mode) or cup (Trackmania cup rules)
gameMode = cup

# --- Cup mode settings (ignored in timeattack) ---
# points needed to become finalist
cup_pointsLimit = 100
# rounds played on a map before switching to the next one
cup_roundsPerMap = 5
# number of winners before the cup ends
cup_nbWinners = 3
# points per rank (lower ranks get the last value, players who don't finish get 0)
cup_pointsRepartition = 10,6,4,3,2,1
# seconds left after the first finisher (-1: automatic, 5 seconds plus platinum medal time divided by 6)
cup_finishTimeout = 20
# maximum length of a round in seconds (if nobody finishes)
cup_roundTimeLimit = 300
